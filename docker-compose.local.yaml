name: gva-local

services:
  mysql:
    image: mysql:8.0.21
    container_name: gva-mysql
    restart: unless-stopped
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: "251210"
    ports:
      - "13306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p251210"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - gva-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: gva-server:local
    container_name: gva-server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8888:8888"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gva-net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: gva-web:local
    container_name: gva-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:8080"
    command: ["nginx-debug", "-g", "daemon off;"]
    networks:
      - gva-net

networks:
  gva-net:
    name: gva-net
    driver: bridge

volumes:
  mysql-data:
    name: gva-mysql-data
